<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Layout: sand-and-wine bento — a mihrab arch holding a tree of life (left), soft glass cards + black pills (right). Single deliberate light look. */
:root {
  --sand: #EFE5D8;
  --sand-2: #E5D6C4;
  --cream: #FBF6EF;
  --glass: rgba(251, 246, 239, 0.74);
  --ink: #1F1715;
  --muted: #7C6B61;
  --line: rgba(31, 23, 21, 0.12);
  --wine: #6B1E2B;
  --wine-2: #8A2C3A;
  --wine-deep: #3F101A;
  --gold: #EBC48F;
  --sun: #EE7A2F;
  --sun-deep: #C2551C;
  --black: #1C1716;
  --f-ar: "Amiri", "Geeza Pro", "Times New Roman", serif;
  --f-cal: "Amiri", "Geeza Pro", "Times New Roman", serif;
  --f-logo: "Aref Ruqaa", "Amiri", "Geeza Pro", serif;
  --f-ui: "Manrope", "Helvetica Neue", system-ui, sans-serif;
  --f-disp: "Cormorant Garamond", "Times New Roman", serif;
  --r: 28px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--sand); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 16px; line-height: 1.55; font-weight: 400; min-height: 100vh;
  background-image: radial-gradient(1200px 600px at 85% -10%, rgba(238,122,47,0.10), transparent 60%), radial-gradient(900px 700px at -10% 110%, rgba(107,30,43,0.10), transparent 60%); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; }
.cal { font-family: var(--f-cal); font-weight: 700; direction: rtl; unicode-bidi: isolate; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand .logo { width: 48px; height: 48px; flex: none; border-radius: 50%; display: block; filter: drop-shadow(0 6px 14px rgba(94,24,36,0.25)); }
.brand .brand-name { display: flex; flex-direction: column; line-height: 1; }
.brand .brand-name small { font-family: var(--f-ui); font-size: 10.5px; font-weight: 500; letter-spacing: 0.42em; color: var(--muted); margin-top: 5px; padding-left: 2px; }
.brand .cal { font-family: var(--f-logo); font-weight: 400; font-size: 38px; line-height: 1; color: var(--wine); }
.brand span:last-child { font-family: var(--f-disp); font-size: 22px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--wine); }
.nav { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.6); }
.nav a { text-decoration: none; padding: 9px 20px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 15px; }
.nav a[aria-current="page"] { background: var(--black); color: var(--cream); }

main { padding-block: 6px 48px; }

/* Bento */
.bento { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { border-radius: var(--r); padding: 26px; position: relative; overflow: hidden; min-width: 0; }
.glass { background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 20px 50px -30px rgba(63,16,26,0.35); }
.white { background: var(--cream); box-shadow: 0 20px 50px -30px rgba(63,16,26,0.35); }
.dark { background: var(--black); color: var(--cream); }
.eyebrow { font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* Constellation (night sky of the desert) */
.sky { position: relative; height: 680px; border-radius: var(--r); overflow: hidden;
  background: radial-gradient(ellipse at 50% 46%, #84303D 0%, var(--wine) 34%, var(--wine-deep) 78%, #2C0A12 100%);
  box-shadow: 0 30px 60px -30px rgba(63,16,26,0.6); }
.sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky .tw { animation: tw 3.5s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: 0.15; } to { opacity: 0.8; } }
.sky .link { stroke-dasharray: var(--len); animation: draw 0.9s ease-out both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
.sky-title { position: absolute; left: 28px; top: 24px; z-index: 3; color: rgba(251,246,239,0.62); font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; }
.sky-key { position: absolute; right: 28px; top: 22px; z-index: 3; display: flex; gap: 16px; color: rgba(251,246,239,0.62); font-size: 13px; }
.sky-key span { display: flex; align-items: center; gap: 6px; }
.sky-key svg { position: static; width: 14px; height: 14px; }
.core-star { position: absolute; transform: translate(-50%, -50%); z-index: 3; text-align: center; pointer-events: none; }
.core-star::before { content: ""; position: absolute; left: 50%; top: 45%; width: 260px; height: 260px; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(235,196,143,0.38) 0%, rgba(235,196,143,0.10) 40%, transparent 70%); z-index: -1; }
.core-star .cal { display: block; font-size: 66px; line-height: 1.1; color: var(--gold); text-shadow: 0 0 24px rgba(235,196,143,0.55); letter-spacing: 0.08em; }
.core-star small { display: block; margin-top: 2px; font-size: 14px; color: rgba(251,246,239,0.78); letter-spacing: 0.04em; }
.node { position: absolute; transform: translate(-50%, -50%); z-index: 4; border: 0; background: none; cursor: pointer; color: var(--cream);
  display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 8px; border-radius: 16px; transition: background 0.2s; animation: appear 0.6s ease-out both; }
@keyframes appear { from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } to { opacity: 1; transform: translate(-50%, -50%); } }
.node:hover { background: rgba(251,246,239,0.08); }
.node svg { position: static; width: 20px; height: 20px; overflow: visible; }
.node .ar { font-size: 32px; line-height: 1.45; opacity: 0.78; }
.node .rl { color: var(--gold); }
.node .t { font-size: 13px; color: rgba(251,246,239,0.62); line-height: 1.15; }
.node .c { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(235,196,143,0.7); margin-top: 3px; }
.node.learned .ar { opacity: 1; }
.node.learned svg path { filter: drop-shadow(0 0 6px rgba(235,196,143,0.9)); }
.node[aria-pressed="true"] { background: rgba(251,246,239,0.12); box-shadow: inset 0 0 0 1px rgba(235,196,143,0.5); }

.legend-mini { display: flex; gap: 16px; font-size: 13.5px; margin-top: 6px; }
.legend-mini i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid var(--wine); }
.legend-mini i.on { background: var(--wine); }
/* motion + popover */
.sky > svg, .sky > .core-star, .sky > .node, .sky > .sky-key, .sky > .sky-title { transition: opacity 0.35s ease; }
.sky.out > * { opacity: 0 !important; }
.root-card .cal, .root-card h1 { transition: opacity 0.3s ease, transform 0.3s ease; }
.root-card.out .cal, .root-card.out h1 { opacity: 0; transform: translateY(6px); }
.ray { stroke: #FBF6EF; stroke-opacity: 0.3; stroke-width: 1; stroke-dasharray: 2 5; transition: stroke 0.4s, stroke-opacity 0.4s, stroke-width 0.4s, opacity 0.4s; }
.ray.on { stroke: #EBC48F; stroke-opacity: 0.7; stroke-width: 1.2; stroke-dasharray: none; }
.ray.on.link { stroke-dasharray: var(--len); }
.ray.sel { stroke: #EBC48F; stroke-opacity: 1; stroke-width: 1.8; stroke-dasharray: none; }
.sky.has-sel .ray:not(.sel) { opacity: 0.3; }
.node { transition: opacity 0.4s ease, background 0.25s ease; }
.sky.has-sel .node:not([aria-pressed="true"]) { opacity: 0.32; }
.sky.has-sel .core-star { opacity: 0.4; }
.core-star { transition: opacity 0.4s ease; }
.node[aria-pressed="true"] { background: none; box-shadow: none; z-index: 5; }
.node:hover { background: none; }
.node .float { display: flex; flex-direction: column; align-items: center; animation: float 6.5s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(-3px); } to { transform: translateY(4px); } }
.node .st { display: block; line-height: 0; transition: transform 0.45s cubic-bezier(.2,.8,.2,1); }
.node:hover .st, .node[aria-pressed="true"] .st { transform: scale(1.4) rotate(45deg); }
.node .ar { transition: transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.4s, color 0.3s; }
.node:hover .ar { opacity: 1; }
.node[aria-pressed="true"] .ar { opacity: 1; transform: scale(1.18); }
.node[aria-pressed="true"] .st svg path { fill: #EBC48F; stroke: #EBC48F; filter: drop-shadow(0 0 8px rgba(235,196,143,1)); }
.core-star::before { animation: breathe 5s ease-in-out infinite alternate; }
@keyframes breathe { from { opacity: 0.65; transform: translate(-50%, -50%) scale(0.94); } to { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } }
.pop { position: absolute; z-index: 8; transform: translateX(-50%); width: 236px; padding: 16px 18px 16px; border-radius: 22px; text-align: center;
  background: rgba(251,246,239,0.95); color: var(--wine-deep); box-shadow: 0 24px 50px -14px rgba(20,4,8,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.pop::before { content: ""; position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.pop.up::before { top: auto; bottom: -6px; }
.pop.in { animation: popin 0.38s cubic-bezier(.2,.8,.2,1) both; }
@keyframes popin { from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.95); } to { opacity: 1; transform: translateX(-50%); } }
.pop-ru { font-family: var(--f-disp); font-weight: 600; font-size: 27px; line-height: 1.1; text-wrap: balance; }
.pop-meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
.pop-act { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.pop-btn { border: 0; border-radius: 999px; background: var(--black); color: var(--cream); padding: 9px 18px; font-size: 14px; font-weight: 500; cursor: pointer; transition: transform 0.2s ease, background 0.2s; }
.pop-btn:hover { transform: translateY(-1px); }
.pop-btn.done { background: transparent; color: var(--wine); box-shadow: inset 0 0 0 1px var(--wine); }
.pop-btn.ghost { background: rgba(31,23,21,0.07); color: var(--ink); width: 38px; padding: 9px 0; }
.word-card > * { animation: fadeup 0.4s cubic-bezier(.2,.8,.2,1) both; }
.word-card > *:nth-child(2) { animation-delay: 0.04s; } .word-card > *:nth-child(3) { animation-delay: 0.08s; } .word-card > *:nth-child(4) { animation-delay: 0.12s; } .word-card > *:nth-child(n+5) { animation-delay: 0.16s; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.panel.enter { animation: fadeup 0.45s cubic-bezier(.2,.8,.2,1) both; }
.pill, .circle, .pillgo span, .opt, .tile { transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
.pill:hover, .pillgo:hover span:first-child { transform: translateY(-1px); }
.pillgo:hover span:last-child { transform: translateX(3px); }
@media (prefers-reduced-motion: reduce) {
  .node .float, .core-star::before, .pop.in, .word-card > *, .panel.enter { animation: none; }
  .sky > *, .ray, .node, .node .st, .node .ar { transition: none; }
}
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 80; width: min(420px, calc(100% - 32px));
  padding: 14px 18px; border-radius: 18px; background: var(--black); color: var(--cream); font-size: 14.5px; line-height: 1.45; box-shadow: 0 20px 40px -12px rgba(0,0,0,0.45);
  opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* Alphabet */
.abc { display: flex; flex-direction: column; gap: 16px; }
.abc-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; align-items: start; }
.abc-grid-card { display: flex; flex-direction: column; gap: 16px; }
.abc-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; direction: rtl; }
.abc-tile { position: relative; border: 1px solid var(--line); background: rgba(251,246,239,0.7); border-radius: 16px; padding: 6px 2px 7px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; transition: background 0.2s, transform 0.2s, border-color 0.2s; }
.abc-tile:hover { background: var(--cream); transform: translateY(-2px); }
.abc-tile .ar { font-size: 34px; line-height: 1.35; color: var(--wine); font-weight: 700; }
.abc-tile small { direction: ltr; font-size: 11.5px; color: var(--muted); line-height: 1.1; }
.abc-tile.nc::after, .dot-nc { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); }
.abc-tile.nc::after { position: absolute; top: 7px; left: 7px; }
.abc-tile[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); }
.abc-tile[aria-pressed="true"] .ar { color: var(--gold); }
.abc-tile[aria-pressed="true"] small { color: rgba(251,246,239,0.75); }
.abc-note { margin: 0; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.abc-card { background: linear-gradient(165deg, var(--wine-2) 0%, var(--wine) 45%, var(--wine-deep) 100%); color: var(--cream); display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 60px -30px rgba(63,16,26,0.6); }
.abc-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.abc-big { font-size: 110px; line-height: 1; color: var(--gold); font-weight: 700; text-shadow: 0 0 30px rgba(235,196,143,0.35); min-width: 90px; text-align: center; }
.abc-head .eyebrow { color: rgba(251,246,239,0.6); }
.abc-head h2 { margin: 4px 0 0; font-family: var(--f-disp); font-weight: 600; font-size: 36px; line-height: 1.1; }
.abc-head h2 .ar { font-size: 0.8em; color: var(--gold); margin-left: 8px; }
.abc-sound { margin: 6px 0 0; font-size: 16px; }
.abc-sound b { color: var(--gold); }
.abc-desc { margin: 4px 0 0; font-size: 14.5px; color: rgba(251,246,239,0.75); line-height: 1.45; }
.abc-say { align-self: start; }
.abc-forms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.abc-form { background: var(--cream); color: var(--wine-deep); border-radius: 18px; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; }
.abc-form .ar { font-size: 50px; line-height: 1.5; }
.abc-form small { font-size: 12.5px; color: var(--muted); }
.abc-warn { margin: 0; font-size: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(238,122,47,0.18); }
.abc-ex { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid rgba(251,246,239,0.14); }
.abc-ex .eyebrow { color: rgba(251,246,239,0.6); }
.abc-ex-row { display: flex; align-items: center; gap: 16px; }
.abc-ex-row .ar { font-size: 44px; line-height: 1.4; }
.abc-ex-row .hl { color: var(--gold); }
.abc-ex-row b { display: block; font-family: var(--f-disp); font-size: 24px; font-weight: 600; line-height: 1.1; }
.abc-ex-row small { color: rgba(251,246,239,0.65); font-size: 13.5px; }
.abc-head.enter, .abc-forms.enter { animation: fadeup 0.4s cubic-bezier(.2,.8,.2,1) both; }
.abc-forms.enter { animation-delay: 0.05s; }
.abc-build { display: flex; flex-direction: column; gap: 16px; }
.build-out { min-height: 104px; display: grid; place-items: center; text-align: center; border-radius: 20px; background: var(--sand); }
.build-out .ar { font-size: 64px; line-height: 1.5; color: var(--wine-deep); }
.build-out em { font-style: normal; color: var(--muted); font-size: 15px; grid-row: 1; }
.build-parts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: rtl; min-height: 0; }
.part { display: flex; flex-direction: column; align-items: center; padding: 4px 10px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--cream); }
.part .ar { font-size: 30px; line-height: 1.45; color: var(--wine); }
.part small { direction: ltr; font-size: 11.5px; color: var(--muted); }
.build-keys { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; justify-content: center; }
.key { width: 44px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--cream); font-family: var(--f-ar); font-size: 26px; color: var(--wine); cursor: pointer; transition: background 0.15s, transform 0.15s; }
.key:hover { background: var(--sand-2); transform: translateY(-1px); }
.key:active { transform: scale(0.95); }
.build-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.build-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.build-presets .ar { font-size: 18px; color: var(--wine); }
@media (max-width: 960px) {
  .abc-top { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .nav { width: 100%; }
  .nav a { flex: 1; text-align: center; padding: 9px 6px; font-size: 13.5px; }
  .abc-grid-card .counter, .abc-build .counter { display: none; }
  .abc-grid { gap: 5px; }
  .abc-tile { border-radius: 12px; }
  .abc-tile .ar { font-size: 26px; }
  .abc-tile small { font-size: 9.5px; }
  .abc-head { grid-template-columns: auto minmax(0, 1fr); }
  .abc-say { grid-column: 2; justify-self: start; }
  .abc-big { font-size: 80px; min-width: 64px; }
  .abc-head h2 { font-size: 30px; }
  .abc-forms { gap: 6px; }
  .abc-form .ar { font-size: 38px; }
  .abc-form small { font-size: 11px; }
  .build-out .ar { font-size: 48px; }
  .key { width: 38px; height: 44px; font-size: 22px; }
  .build-presets { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .abc-head.enter, .abc-forms.enter { animation: none; } .abc-tile, .key { transition: none; } }
/* Root card */
.root-card { display: flex; flex-direction: column; gap: 18px; }
.root-head { display: flex; justify-content: space-between; align-items: center; }
.root-card .cal { font-size: 64px; line-height: 1.1; color: var(--wine); }
.root-card h1 { margin: -6px 0 0; font-family: var(--f-disp); font-weight: 600; font-size: 46px; line-height: 1.05; }
.root-card h1 em { font-style: italic; color: var(--muted); font-size: 0.6em; }
.root-nav { display: flex; align-items: center; gap: 10px; }
.circle { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--black); color: var(--cream); cursor: pointer; display: grid; place-items: center; font-size: 18px; transition: transform 0.15s; }
.circle:hover { transform: scale(1.06); }
.circle.light { background: rgba(31,23,21,0.06); color: var(--ink); }
.pill { border-radius: 999px; border: 1px solid var(--line); background: transparent; padding: 12px 22px; cursor: pointer; font-weight: 500; font-size: 15px; }
.pill:hover { background: rgba(31,23,21,0.05); }
.pill.black { background: var(--black); border-color: var(--black); color: var(--cream); }
.pill.cream { background: var(--cream); border-color: var(--cream); color: var(--wine-deep); }
.pillgo { display: inline-flex; align-items: center; gap: 0; border: 0; background: none; cursor: pointer; padding: 0; }
.pillgo span:first-child { background: var(--black); color: var(--cream); border-radius: 999px; padding: 13px 24px; font-weight: 500; font-size: 15px; }
.pillgo span:last-child { width: 44px; height: 44px; border-radius: 50%; background: var(--black); color: var(--cream); display: grid; place-items: center; margin-left: -6px; box-shadow: -3px 0 0 var(--glass-solid, #F4EDE4); }
.pillgo.on-dark span { background: var(--cream); color: var(--black); }
.pillgo.on-dark span:last-child { box-shadow: -3px 0 0 var(--black); }
.counter { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }

/* Word card */

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; };
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Arabic helpers ----------
  const HAR = /[ؐ-ًؚ-ٰٟ]/;
  const HAMZA = "أإآءئؤ";
  const norm = c => HAMZA.includes(c) ? "ء" : c;
  function clusters(s) { const out = []; for (const ch of s) { if (HAR.test(ch) && out.length) out[out.length - 1] += ch; else out.push(ch); } return out; }
  function rootIdx(word, letters) {
    const L = letters.map(norm), idx = []; let k = 0;
    clusters(word).forEach((c, i) => { if (k < L.length && norm(c[0]) === L[k]) { idx.push(i); k++; } });
    return idx.length === L.length ? idx : [];
  }
  function marked(word, letters) {
    const set = new Set(rootIdx(word, letters));
    return clusters(word).map((c, i) => set.has(i) ? `<span class="rl">${c}</span>` : c).join("");
  }
  const FAL = ["ف", "ع", "ل"];

  // ---------- Progress (this browser only) ----------
  const TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
  const TGU = TG && TG.initDataUnsafe ? TG.initDataUnsafe.user : null;
  const CFG = window.JAMAL_CONFIG || {};
  const REMOTE = !!(TG && CFG.supabaseUrl && CFG.anonKey);
  const KEY = "jamal-progress-v1" + (TGU ? "-" + TGU.id : "");
  window.JAMAL_HAPTIC = kind => { try { TG && TG.HapticFeedback.notificationOccurred(kind); } catch (e) {} };
  if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor("#EFE5D8"); TG.setBackgroundColor("#EFE5D8"); } catch (e) {} }
  let P = { learned: {}, solved: 0, streak: 0, best: 0, level: "novice" };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") P = { ...P, ...s }; } catch (e) {}
  async function callApi(body) {
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/functions/v1/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + CFG.anonKey, "apikey": CFG.anonKey },
      body: JSON.stringify(Object.assign({ initData: TG.initData }, body))
    });
    if (!r.ok) throw new Error(r.status + " " + await r.text());
    return r.json();
  }
  let syncTimer = null;
  const pushRemote = () => { if (REMOTE) callApi({ action: "save", progress: P }).catch(e => console.warn("sync failed", e)); };
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
    if (!REMOTE) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushRemote, 700);
  };
  async function loadRemote() {
    if (!REMOTE) return;
    try {
      const res = await callApi({ action: "load" });
      const R = res && res.progress;
      if (R && typeof R === "object") {
        P = Object.assign({}, P, R, {
          learned: Object.assign({}, R.learned || {}, P.learned || {}),
          solved: Math.max(P.solved || 0, R.solved || 0),
          best: Math.max(P.best || 0, R.best || 0)
        });
      }
      save();
    } catch (e) { console.warn("load failed", e); }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && syncTimer) { clearTimeout(syncTimer); pushRemote(); } });

  // ---------- Data ----------
  let CATS = {}, ROOTS = [], RBY = {}, WORDS = [], WBY = {};
  const S = { i: 0, word: null };
  const curRoot = () => ROOTS[S.i];
  const rootStr = r => r.letters.join(" ");
  const learnedIn = r => r.words.filter(w => P.learned[w.id]).length;

  Promise.all([fetch("words.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), loadRemote()]).then(([db]) => {
    CATS = db.categories; ROOTS = db.roots;
    const LEGACY = {};
    ROOTS.forEach(r => { RBY[r.id] = r; r.words.forEach((w, i) => { w.id = w.id || `${r.id}-${i}`; w.root = r.id; if (w.legacy) LEGACY[w.legacy] = w.id; WORDS.push(w); WBY[w.id] = w; }); });
    // move progress saved under old numbered codes (e.g. "ktb-3") to permanent codes
    let moved = false;
    Object.keys(P.learned || {}).forEach(k => { if (!WBY[k] && LEGACY[k]) { P.learned[LEGACY[k]] = true; delete P.learned[k]; moved = true; } });
    if (moved) save();
    $("#loading").hidden = true;
    route();
    window.addEventListener("hashchange", route);
    let lastW = 0;
    new ResizeObserver(() => { const w = $("#arch").clientWidth; if (w && w !== lastW) { lastW = w; drawTree(false); } }).observe($("#arch"));
  }).catch(() => { $("#loading").textContent = "Не удалось загрузить корни. Обновите страницу."; });

  // ---------- Routing ----------
  function route() {
    const h = location.hash;

  // ---------- Constellation drawing ----------
  function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
  const f = n => n.toFixed(1);
  const STAR = (fill, stroke) => `<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0,-9.5 C1,-2 2,-1 9.5,0 C2,1 1,2 0,9.5 C-1,2 -2,1 -9.5,0 C-2,-1 -1,-2 0,-9.5Z" fill="${fill}" stroke="${stroke}" stroke-width="1"/></svg>`;
  const ORDER = ["verb", "noun", "doer", "object", "place", "tool", "quality"];

  function drawTree(animate) {
    const r = curRoot(); const el = $("#arch");
    const W = el.clientWidth, H = el.clientHeight; if (!W) return;
    const rnd = rng(r.id), small = W < 520, anim = animate && !reduceMotion();
    const cx = W / 2, cy = H / 2 + 8;
    const words = ORDER.flatMap(k => r.words.filter(w => w.cat === k));
    const n = words.length;
    const rx = Math.min(W / 2 - (small ? 58 : 100), 290), ry = Math.min(H / 2 - (small ? 96 : 104), 236);
    const off = (n % 2 === 0 ? Math.PI / n : 0) + (rnd() - 0.5) * 0.3;
    const pts = words.map((w, i) => {
      const a = -Math.PI / 2 + off + i * 2 * Math.PI / n + (rnd() - 0.5) * 0.3;
      const k = 0.84 + rnd() * 0.16;
      let x = cx + Math.cos(a) * rx * k, y = cy + Math.sin(a) * ry * k;
      // keep words clear of the central root on narrow screens
      const clearY = small ? 118 : 0;
      if (Math.abs(y - cy) < clearY) y = cy + Math.sign(Math.sin(a) || 1) * clearY;
      return { w, x, y };
    });
    const starDy = small ? 34 : 40;

    let svg = "";
    // background stars
    for (let i = 0; i < (small ? 55 : 90); i++) {
      const x = rnd() * W, y = rnd() * H, rad = 0.4 + rnd() * 1.2, op = 0.15 + rnd() * 0.55;
      svg += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(rad)}" fill="#FBF6EF" opacity="${op.toFixed(2)}" ${rnd() > 0.7 ? `class="tw" style="animation-delay:${f(rnd() * 3)}s"` : ""}/>`;
    }
    // faint outline joining the stars
    svg += `<polygon points="${pts.map(p => `${f(p.x)},${f(p.y - starDy)}`).join(" ")}" fill="none" stroke="#EBC48F" stroke-opacity="0.13" stroke-width="1"/>`;
    // rays from the root to every word
    pts.forEach((p, i) => {
      const sx = p.x, sy = p.y - starDy, dx = sx - cx, dy = sy - cy, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      const start = small ? 62 : 82;
      const x1 = cx + ux * start, y1 = cy + uy * start, x2 = sx - ux * 13, y2 = sy - uy * 13;
      const learned = !!P.learned[p.w.id];
      const len = Math.hypot(x2 - x1, y2 - y1);
      svg += `<line class="ray${learned ? " on" : ""}${learned && anim ? " link" : ""}${S.word === p.w.id ? " sel" : ""}" data-w="${p.w.id}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" style="--len:${Math.ceil(len)};animation-delay:${i * 80}ms"/>`;
    });

    const nodes = pts.map((p, i) => {
      const learned = !!P.learned[p.w.id];
      return `<button class="node ${learned ? "learned" : ""}" style="left:${f(p.x)}px;top:${f(p.y)}px;animation-delay:${anim ? 150 + i * 90 : 0}ms${anim ? "" : ";animation:none"}" data-word="${p.w.id}" aria-pressed="${S.word === p.w.id}" aria-label="${esc(p.w.tr)}">
        <span class="float" style="animation-delay:-${(i * 1.9).toFixed(1)}s"><span class="st">${starFor(learned)}</span>
        <span class="ar" lang="ar">${marked(p.w.ar, r.letters)}</span><span class="t">${esc(p.w.tr)}</span><span class="c">${esc(CATS[p.w.cat].name)}</span></span></button>`;
    }).join("");

    el.innerHTML = `<svg aria-hidden="true">${svg}</svg>
      <span class="sky-title">Созвездие корня</span>
      <div class="sky-key"><span>${STAR("none", "rgba(251,246,239,0.7)")}новое</span><span>${STAR("#EBC48F", "#EBC48F")}выучено</span></div>
      <div class="core-star" style="left:${f(cx)}px;top:${f(cy)}px"><span class="cal" lang="ar">${rootStr(r)}</span><small>${esc(r.meaning)}</small></div>
      ${nodes}<div class="pop" id="pop" hidden></div>`;
    if (S.word) showPop(false); else el.classList.remove("has-sel");
  }
  const starFor = learned => learned ? STAR("#EBC48F", "#EBC48F") : STAR("none", "rgba(251,246,239,0.7)");

  function showPop(animate = true) {
    const el = $("#arch"), pop = $("#pop"); if (!pop) return;
    const w = S.word && WBY[S.word];
    const node = w && el.querySelector(`.node[data-word="${w.id}"]`);
    if (!w || !node) { pop.hidden = true; el.classList.remove("has-sel"); return; }
    const c = CATS[w.cat], learned = !!P.learned[w.id];
    pop.innerHTML = `<div class="pop-ru">${esc(w.ru)}</div>

    const nx = parseFloat(node.style.left), ny = parseFloat(node.style.top), nh = node.offsetHeight / 2;

    pop.style.top = (below ? ny + nh + 6 : ny - nh - 6 - ph) + "px";
    pop.classList.toggle("up", !below);
    if (animate) { pop.classList.remove("in"); void pop.offsetWidth; pop.classList.add("in"); }

  function refreshNode(id) {

  $("#arch").addEventListener("click", e => {

  // ---------- Word card ----------
  let arVoice = null;
  function findVoice() { try { arVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ar")) || null; } catch (e) {} }
  if ("speechSynthesis" in window) { findVoice(); speechSynthesis.onvoiceschanged = () => { findVoice(); if (S.word) renderWord(); }; }
  // Read a single word in pause form (waqf): no case ending, so كَاتِب sounds "katib", not "katibun".
  // A sukun on the last letter tells the voice to stop there; words already ending in a vowel (verbs) stay as they are.
  const pausal = ar => /[ً-ْ]$/.test(ar) ? ar : ar + "ْ";
  const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  function speak(t) {
    const ss = window.speechSynthesis;
    if (!canSpeak || !ss) return sayFail();
    let u;
    try {
      u = new SpeechSynthesisUtterance(pausal(t));
      u.lang = (arVoice && arVoice.lang) || "ar-SA";
      if (arVoice) u.voice = arVoice;
      u.rate = 0.8;
    } catch (e) { return sayFail(); }
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = e => { if (e && (e.error === "interrupted" || e.error === "canceled")) return; sayFail(); };
    const go = () => { try { ss.resume(); ss.speak(u); } catch (e) { sayFail(); } };
    // iOS/WebKit drops speech if cancel() and speak() run back to back — only cancel when something is playing.
    if (ss.speaking || ss.pending) { ss.cancel(); setTimeout(go, 120); } else go();
    setTimeout(() => { if (!started && !ss.speaking) sayFail(); }, 2500);
  }
  let toastTimer = null;

    el.textContent = "Звук не воспроизвёлся. Проверьте громкость и режим «Без звука». На некоторых телефонах в Telegram арабского голоса нет.";

    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 5000);
  }

  function renderWord() {

  // ---------- Alphabet ----------
  // c: letter, n: Arabic name, ru: name in Russian, s: sound (Cyrillic), d: how to say it, j: joins the NEXT letter
  const LETTERS = [
    { c: "ا", n: "أَلِف", ru: "алиф", s: "а̄", d: "Долгое «а». В начале слова — опора для короткой гласной.", j: false },
    { c: "ب", n: "بَاء", ru: "ба", s: "б", d: "Как русское «б».", j: true },
    { c: "ت", n: "تَاء", ru: "та", s: "т", d: "Как русское «т».", j: true },
    { c: "ث", n: "ثَاء", ru: "са", s: "с (межзубное)", d: "Кончик языка между зубами, как английское th в think.", j: true },
    { c: "ج", n: "جِيم", ru: "джим", s: "дж", d: "Как «дж» в слове «джинсы».", j: true },
    { c: "ح", n: "حَاء", ru: "ха", s: "х (глубокое)", d: "Сильный беззвучный выдох из глубины горла, как когда дышат на стекло.", j: true },
    { c: "خ", n: "خَاء", ru: "ха", s: "х", d: "Как русское «х» в слове «хор».", j: true },
    { c: "د", n: "دَال", ru: "даль", s: "д", d: "Как русское «д».", j: false },
    { c: "ذ", n: "ذَال", ru: "заль", s: "з (межзубное)", d: "Кончик языка между зубами, как английское th в this.", j: false },
    { c: "ر", n: "رَاء", ru: "ра", s: "р", d: "Раскатистое «р».", j: false },
    { c: "ز", n: "زَاي", ru: "зай", s: "з", d: "Как русское «з».", j: false },
    { c: "س", n: "سِين", ru: "син", s: "с", d: "Как русское «с».", j: true },
    { c: "ش", n: "شِين", ru: "шин", s: "ш", d: "Как русское «ш», но мягче.", j: true },
    { c: "ص", n: "صَاد", ru: "сад", s: "с (твёрдое)", d: "Твёрдое «с»: язык прижат, звук низкий и «толстый».", j: true },
    { c: "ض", n: "ضَاد", ru: "дад", s: "д (твёрдое)", d: "Твёрдое «д». Арабский язык называют «языком дада».", j: true },
    { c: "ط", n: "طَاء", ru: "та", s: "т (твёрдое)", d: "Твёрдое «т», звучит низко.", j: true },
    { c: "ظ", n: "ظَاء", ru: "за", s: "з (твёрдое межзубное)", d: "Твёрдая пара к ذ: язык между зубами, звук низкий.", j: true },
    { c: "ع", n: "عَيْن", ru: "‘айн", s: "‘", d: "Гортанный звук, которого нет в русском: сжатие горла, как перед стоном.", j: true },
    { c: "غ", n: "غَيْن", ru: "гайн", s: "г (картавое)", d: "Картавое «г», как французское r.", j: true },
    { c: "ف", n: "فَاء", ru: "фа", s: "ф", d: "Как русское «ф».", j: true },
    { c: "ق", n: "قَاف", ru: "каф", s: "к (глубокое)", d: "«К» из самой глубины горла.", j: true },
    { c: "ك", n: "كَاف", ru: "кяф", s: "к", d: "Как русское «к».", j: true },
    { c: "ل", n: "لَام", ru: "лям", s: "л", d: "Как русское «л», чаще мягкое.", j: true },
    { c: "م", n: "مِيم", ru: "мим", s: "м", d: "Как русское «м».", j: true },
    { c: "ن", n: "نُون", ru: "нун", s: "н", d: "Как русское «н».", j: true },
    { c: "ه", n: "هَاء", ru: "ха", s: "h", d: "Лёгкий выдох, как английское h в home.", j: true },
    { c: "و", n: "وَاو", ru: "вав", s: "в / ӯ", d: "Как английское w, а после «у» — долгое «у».", j: false },
    { c: "ي", n: "يَاء", ru: "йа", s: "й / ӣ", d: "Как «й», а после «и» — долгое «и».", j: true }
  ];
  const ZWJ = "‍";
  const NON_JOIN = "اأإآدذرزوؤةء";           // letters that never join the letter after them
  const joinsNext = ch => !NON_JOIN.includes(ch);
  const forms = L => ({
    iso: L.c,
    ini: L.j ? L.c + ZWJ : L.c,
    med: L.j ? ZWJ + L.c + ZWJ : ZWJ + L.c,
    fin: ZWJ + L.c
  });
  const FORM_NAME = { iso: "отдельно", ini: "в начале", med: "в середине", fin: "в конце" };
  // which shape a letter takes at position i of a word (by its neighbours, not by its place in the word)
  function formAt(bases, i) {
    const prev = i > 0 && joinsNext(bases[i - 1]);
    const next = i < bases.length - 1 && joinsNext(bases[i]);
    return prev && next ? "med" : prev ? "fin" : next ? "ini" : "iso";
  }
  const EXTRA_EXAMPLES = {
    "ث": { ar: "ثَلَاثَة", tr: "саласа", ru: "три" },
    "ذ": { ar: "ذَهَب", tr: "захаб", ru: "золото" },
    "ض": { ar: "ضَيْف", tr: "дайф", ru: "гость" }
  };
  const SAME_SHAPE = { "ا": "اأإآ" };
  function exampleFor(L) {
    const shapes = SAME_SHAPE[L.c] || L.c;
    const pool = WORDS.concat(Object.values(EXTRA_EXAMPLES).map(x => Object.assign({ cat: "noun" }, x)));
    let best = null;
    pool.forEach(w => {
      const cl = clusters(w.ar);
      const i = cl.findIndex(c => shapes.includes(c[0]));
      if (i < 0) return;
      const score = (i === 0 ? 0 : 10) + cl.length;   // prefer the letter at the start, and short words
      if (!best || score < best.score) best = { w, i, score };
    });
    return best;
  }

  const A = { i: 1, build: [] };
  function renderAlphabet() {
    $("#abc-grid").innerHTML = LETTERS.map((L, i) => `<button class="abc-tile ${L.j ? "" : "nc"}" data-li="${i}" aria-pressed="${i === A.i}" aria-label="${esc(L.ru)}">
      <span class="ar" lang="ar">${L.c}</span><small>${esc(L.ru)}</small></button>`).join("");
    renderLetter(false); renderBuilder();
  }
  function renderLetter(animate) {
    const L = LETTERS[A.i], F = forms(L), ex = exampleFor(L);
    let exHtml = "";
    if (ex) {
      const cl = clusters(ex.w.ar), bases = cl.map(c => c[0]);
      const word = cl.map((c, k) => k === ex.i ? `<span class="hl">${c}</span>` : c).join("");
      exHtml = `<div class="abc-ex"><span class="eyebrow">Пример</span>
        <div class="abc-ex-row"><span class="ar" lang="ar">${word}</span>
        <div><b>${esc(ex.w.ru.split(",")[0])}</b><small>${esc(ex.w.tr)} · здесь форма «${FORM_NAME[formAt(bases, ex.i)]}»</small></div></div></div>`;
    }
    $("#abc-card").innerHTML = `<div class="abc-head ${animate ? "enter" : ""}">
        <span class="abc-big ar" lang="ar">${L.c}</span>
        <div><span class="eyebrow">${A.i + 1} / 28 · ${L.j ? "соединяется с обеих сторон" : "соединяется только справа"}</span>
          <h2>${esc(L.ru)} <span class="ar" lang="ar">${L.n}</span></h2>
          <p class="abc-sound">Звук: <b>${esc(L.s)}</b></p>
          <p class="abc-desc">${esc(L.d)}</p></div>
        ${canSpeak ? `<button class="pop-btn ghost abc-say" data-say="${esc(L.n)}" aria-label="Послушать название">▶</button>` : ""}
      </div>
      <div class="abc-forms ${animate ? "enter" : ""}">${["fin", "med", "ini", "iso"].map(k => `<div class="abc-form"><span class="ar" lang="ar">${F[k]}</span><small>${FORM_NAME[k]}</small></div>`).join("")}</div>
      ${L.j ? "" : `<p class="abc-warn">Буква «${esc(L.ru)}» не цепляется к следующей букве, поэтому формы «в начале» и «в середине» совпадают с отдельной и конечной.</p>`}
      ${exHtml}`;
  }
  $("#abc-grid").addEventListener("click", e => {
    const b = e.target.closest("[data-li]"); if (!b) return;
    A.i = +b.dataset.li;
    document.querySelectorAll(".abc-tile").forEach(t => t.setAttribute("aria-pressed", t.dataset.li === b.dataset.li));
    renderLetter(true);
    if (matchMedia("(max-width: 960px)").matches) $("#abc-card").scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "nearest" });
  });
  $("#abc-card").addEventListener("click", e => { const t = e.target.closest("[data-say]"); if (t) speak(t.dataset.say); });

  // «Собери слово»: tap letters and watch them join
  const PRESETS = [["كتاب", "китаб", "книга"], ["مدرسة", "мадраса", "школа"], ["باب", "баб", "дверь"], ["جميل", "джамиль", "красивый"]];
  function renderBuilder() {
    const b = A.build;
    const joined = b.join("");
    $("#abc-build").innerHTML = `<div class="root-head"><span class="eyebrow">Собери слово</span><span class="counter">нажимайте буквы — они сами соединятся</span></div>
      <div class="build-out"><span class="ar" lang="ar">${joined || "&nbsp;"}</span>${b.length ? "" : `<em>Начните с любой буквы или выберите пример ниже</em>`}</div>
      <div class="build-parts">${b.map((ch, i) => `<span class="part ${formAt(b, i)}"><span class="ar" lang="ar">${forms(LETTERS.find(L => L.c === ch) || { c: ch, j: joinsNext(ch) })[formAt(b, i)]}</span><small>${FORM_NAME[formAt(b, i)]}</small></span>`).join("")}</div>
      <div class="build-keys">${LETTERS.map(L => `<button class="key" data-k="${L.c}" lang="ar">${L.c}</button>`).join("")}<button class="key" data-k="ة" lang="ar" title="та марбута">ة</button></div>
      <div class="build-actions">
        <button class="pill" data-act="back">⌫ Стереть букву</button><button class="pill" data-act="clear">Очистить</button>
        <span class="build-presets">${PRESETS.map(p => `<button class="pill" data-preset="${p[0]}"><span class="ar" lang="ar">${p[0]}</span> ${esc(p[2])}</button>`).join("")}</span>
      </div>`;
  }
  $("#abc-build").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.k) { if (A.build.length < 12) A.build.push(t.dataset.k); }
    else if (t.dataset.act === "back") A.build.pop();
    else if (t.dataset.act === "clear") A.build = [];
    else if (t.dataset.preset) A.build = [...t.dataset.preset];
    renderBuilder();
  });

  // ---------- Game: «Найди слово» ----------
  // Question in Russian, four Arabic words of the SAME root. Learner picks the one that matches.
  let G = null;
  const buzz = kind => { try { window.JAMAL_HAPTIC && window.JAMAL_HAPTIC(kind); } catch (e) {} };
  const SAME = "Глагол «он сделал»: в слове только три буквы корня с короткими гласными.";
  const PATTERN_HINT = {
    "فَعَلَ": SAME, "فَعِلَ": SAME, "فَعُلَ": SAME,
    "فَاعَلَ": "Глагол с долгим «а̄» после первой буквы корня.",
    "فَاعِل": "Долгое «а̄» после первой буквы корня (ка̄тиб) — тот, кто делает.",
    "فَاعِلَة": "Долгое «а̄» после первой буквы и «-а» на конце — та, что делает, или прибор.",
    "مُفَعِّل": "«му-» в начале и удвоенная средняя буква — тот, кто делает. Часто профессия.",
    "مُفَاعِل": "«му-» в начале — тот, кто делает. Часто профессия.",
    "مَفْعُول": "«ма-» в начале и «-ӯ-» перед последней буквой — то, что сделали.",
    "مَفْعَل": "«ма-» в начале — место, где это делают.",
    "مَفْعِل": "«ма-» в начале — место, где это делают.",
    "مَفْعَلَة": "«ма-» в начале и «-а» на конце — место, где это делают.",
    "مِفْعَال": "«ми-» в начале и долгое «а̄» — инструмент, которым это делают.",
    "فَعَّال": "Удвоенная средняя буква и долгое «а̄» — профессия.",
    "فُعَّال": "Удвоенная средняя буква и долгое «а̄» — те, кто это делает.",
    "فَعَّالَة": "Удвоенная средняя буква, долгое «а̄» и «-а» на конце — прибор или предмет.",
    "فَاعُول": "Долгие «а̄» и «ӯ» — устройство.",
    "فَعِيل": "Долгое «ӣ» перед последней буквой — признак: какой?",
    "أَفْعَل": "«а-» в начале — «более» или «самый».",
    "تَفْعِيل": "«та-» в начале и долгое «ӣ» — само действие."
  };
  const hintFor = w => PATTERN_HINT[w.pattern] || "Короткая форма без приставок — само действие или вещь.";
  const short = ru => ru.split(",")[0].trim();

  function newRound(preferRoot) {
    const pool = WORDS.filter(w => RBY[w.root].words.length >= 3 && (!preferRoot || w.root === preferRoot));
    const fresh = pool.filter(w => !P.learned[w.id]);
    const src = fresh.length ? fresh : pool;
    let w = pick(src);
    if (G && G.word && src.length > 1) while (w.id === G.word.id) w = pick(src);
    const r = RBY[w.root];
    const others = shuffle(r.words.filter(x => x.id !== w.id && short(x.ru) !== short(w.ru))).slice(0, 3);
    G = { word: w, root: r, opts: shuffle([w, ...others]), wrong: new Set(), done: false, preferRoot, fresh: false };
    renderRound(true);
  }

  function renderRound(enter) {
    const { word: w, root: r } = G;
    const choices = G.opts.map(o => {
      const isAns = o.id === w.id, bad = G.wrong.has(o.id);
      const cls = G.done ? (isAns ? "ok" : "dim") : (bad ? "bad" : "");
      const reveal = bad || (G.done && !isAns) ? `<span class="ru">${esc(short(o.ru))}</span>` : "";
      return `<button class="choice ${cls}" data-pick="${o.id}" ${G.done || bad ? "disabled" : ""}>
        <span class="ar" lang="ar">${marked(o.ar, r.letters)}</span><span class="tr">${esc(o.tr)}</span>${reveal}</button>`;
    }).join("");
    const explain = G.done ? `<div class="explain">
        <div class="ex-word"><span class="ar" lang="ar">${marked(w.ar, r.letters)}</span><div><b>${esc(w.ru)}</b><small>${esc(w.tr)}</small></div></div>
        <p class="ex-hint">💡 ${esc(hintFor(w))}</p>
        <div class="actions"><button class="pillgo on-dark" data-next><span>Следующее слово</span><span>→</span></button><button class="pill ghost-dark" data-open>В созвездии</button></div>
      </div>` : "";
    $("#case").innerHTML = `<div class="glow" aria-hidden="true"></div>
      <div class="case-top"><span class="eyebrow">Корень <span class="cal" lang="ar">${rootStr(r)}</span> · ${esc(r.meaning)}</span><span class="eyebrow">${P.streak ? `Серия ${P.streak}` : ""}</span></div>
      <div class="ask ${enter ? "enter" : ""}"><span class="eyebrow">${G.done ? (G.wrong.size ? `Нашли с ${G.wrong.size + 1}-й попытки` : "Верно с первой попытки!") : "Где здесь"}</span><h2>«${esc(short(w.ru))}»${G.done ? "" : "?"}</h2></div>
      <div class="choices ${enter ? "enter" : ""}">${choices}</div>${explain}`;
  }

  $("#case").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t || !G) return;
    if ("next" in t.dataset) return newRound(G.preferRoot);
    if ("open" in t.dataset) { S.i = ROOTS.indexOf(G.root); S.word = G.word.id; location.hash = "#tree"; return; }
    const id = t.dataset.pick; if (!id || G.done) return;
    if (id === G.word.id) {
      buzz("success");
      G.done = true;
      P.solved = (P.solved || 0) + 1;
      if (G.wrong.size === 0) { P.learned[G.word.id] = true; P.streak = (P.streak || 0) + 1; }
      else P.streak = 0;
      P.best = Math.max(P.best || 0, P.streak);
      save();
      renderRound(false);
      const ex = document.querySelector("#case .explain"); if (ex && matchMedia("(max-width: 560px)").matches) ex.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "nearest" });
    } else {
      buzz("error");
      G.wrong.add(id);
      renderRound(false);
      const b = document.querySelector(`.choice[data-pick="${id}"]`); if (b) b.classList.add("shake");
    }
  });
})();
</script>

</body>
</html>
